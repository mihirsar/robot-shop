apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: robot-shop
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mihirsar/robot-shop.git
    targetRevision: master
    path: K8s/helm

    helm:
      releaseName: robot-shop

  destination:
    server: https://kubernetes.default.svc
    namespace: robot-shop

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
